# Serves the built React app and forwards /api (incl. uploaded videos) to
# the API container — the same shape as the Vite dev proxy.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Phone videos of a set can be big; matches MAX_VIDEO_BYTES in the API.
  client_max_body_size 500m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }

  # Hashed build assets never change — cache them hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
